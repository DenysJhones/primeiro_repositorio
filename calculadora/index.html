<!DOCTYPE html>
<html lang="Pt-br">
    
    <head>
        <meta charset="UTF-8">
        <title>CALCULADORA</title>
    </head>  
    
       <body>
        <div class=""><h1>Calculadora</h1>
            <p><input type="text" name="" id="num1" placeholder="Digite um numero"></p>        
            <p><input type="text" name="" id="num2" placeholder="Digite outro numero"></p>
            <br><button onclick="calcular('+')">Somar</button>
            <button onclick="calcular('-')">Subtrair</button>
            <button onclick="calcular('*')">Multiplicar</button>
            <button onclick="calcular('/')">Dividir</button>
            <p>Resultado: <span id="resultado"></span></p></div>
        
       </body>
